name: nestam-server

on:
  push:
    paths: ["nestam/server/**", ".github/workflows/nestam-server.yml"]
  pull_request:
    paths: ["nestam/server/**", ".github/workflows/nestam-server.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nestam/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nestam/server/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
