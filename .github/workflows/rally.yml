name: rally

on:
  push:
    branches: ["**"]
    paths: ["rally/**", "tennis-app/**", ".github/workflows/rally.yml"]
  pull_request:
    paths: ["rally/**", "tennis-app/**", ".github/workflows/rally.yml"]

jobs:
  # Seam 1: the HTTP boundary against a real Postgres. Seam 2: the TypeScript side of the fixtures.
  typescript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: rally, POSTGRES_PASSWORD: rally, POSTGRES_DB: rally_test }
        ports: ["54329:5432"]
        options: --health-cmd "pg_isready -U rally" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: rally } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: rally/package-lock.json }
      - run: npm ci --workspaces --include-workspace-root
      - run: npm run check --workspaces --if-present
      - run: npm test
        env:
          RALLY_TEST_DATABASE_URL: postgres://rally:rally@127.0.0.1:54329/rally_test

  # Seam 2: the Kotlin reference domain against the same fixture file. If this and the
  # TypeScript job disagree about rally/fixtures/**, the build is red.
  kotlin-reference:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tennis-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle :shared:jvmTest --console=plain
