# Pinned per ADR-025. Every version here is verified in research/10-kmp-cmp-state-of-the-art.md.
#
# Rule from ADR-025, and it is the one that keeps this file honest:
#   never let a nice-to-have library gate a Kotlin upgrade - drop the library.
#
# Gradle: 9.5.1 once an Android target exists (AGP 9.3.0 needs >= 9.5.0, and Kotlin 2.4.0
# documents support only to 9.5.0 - a one-version window). Until then 8.14.3 is inside
# Kotlin's supported range and is what the wrapper uses.

[versions]
kotlin              = "2.4.10"   # Stable channel only
coroutines          = "1.11.0"
serialization       = "1.11.0"
datetime            = "0.8.0"    # pre-1.0: pin hard, and keep its types off the wire
okio                = "3.18.1"

# Not yet applied - here so the pinned set is recorded in one place (ADR-025).
compose             = "1.12.0"
agp                 = "9.3.0"
ksp                 = "2.3.11"   # versioned independently of Kotlin since KSP 2.x
ktor                = "3.5.2"    # client and server, same line
sqldelight          = "2.3.2"
koin                = "4.2.2"
navigation          = "2.9.2"
coil                = "3.6.0"
turbine             = "1.2.1"
settings            = "1.3.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
